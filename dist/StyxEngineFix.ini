; Styx Engine Fix settings

[Framerate]
; Frame rate limit in fps. The game normally caps at 62. 0 = unlimited.
; Applied to My Games\Styx\StyxGame\Config\StyxEngine.ini every time the game starts.
FpsLimit=144

[Physics]
; Physics simulation rate in Hz. The game was tuned for its own 62 fps cap: keeps ragdolls and physics objects
; behaving correctly above 62 fps. 0 = off (game default: one physics step per frame).
PhysicsRate=62
